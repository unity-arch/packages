source /etc/makepkg.conf

# repo-local makepkg config, cachyos ships -march=native and lto which is wrong for
# packages that get published, so pin the plain arch flags here
CFLAGS="-march=x86-64 -mtune=generic -O2 -pipe -fno-plt -fexceptions -Wp,-D_FORTIFY_SOURCE=3 -Wformat -Werror=format-security -fstack-clash-protection -fcf-protection -fno-omit-frame-pointer -mno-omit-leaf-frame-pointer"
CXXFLAGS="$CFLAGS -Wp,-D_GLIBCXX_ASSERTIONS"
LDFLAGS="-Wl,-O1 -Wl,--sort-common -Wl,--as-needed -Wl,-z,relro -Wl,-z,now -Wl,-z,pack-relative-relocs"
LTOFLAGS="-flto=auto"
RUSTFLAGS="-Cforce-frame-pointers=yes"
MAKEFLAGS="-j$(nproc)"
BUILDENV=(!distcc color !ccache check !sign)
OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge !debug !lto !autodeps)
PKGEXT='.pkg.tar.zst'
SRCEXT='.src.tar.gz'
# built packages land next to this file, whatever the checkout path is
PKGDEST="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)/repo"
